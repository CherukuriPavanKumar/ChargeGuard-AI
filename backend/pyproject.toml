[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChargeGuard-sentinel"
version = "1.0.0"
description = "Autonomous multi-modal chargeback defence and economic arbitrage engine"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ChargeGuard.AI" }]
keywords = ["chargeback", "representment", "risk", "expected-value", "fintech"]

classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "rapidfuzz>=3.6",
    "pillow>=10.2",
    "pytesseract>=0.3.10",
    "jinja2>=3.1",
    "anthropic>=0.25",
    "httpx>=0.27",
]

[project.optional-dependencies]
# WeasyPrint needs a native GTK stack. Optional so a failed install degrades the
# packet format to HTML rather than breaking the build. See packet/renderer.py.
pdf = ["weasyprint>=61.0"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
ChargeGuard-generate = "data_gen.generator:main"
ChargeGuard-train = "sentinel.models.train:main"
ChargeGuard-eval = "eval.harness:main"

# `sentinel` lives under src/; `data_gen` and `eval` are top-level packages at
# the backend root, because they are build tooling rather than shipped library
# code and should not be importable from a deployed service by accident.
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["sentinel*", "data_gen*", "eval*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
sentinel = [
    "llm/prompts/*.txt",
    "packet/templates/*.html",
    "models/artifacts/.gitkeep",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error::DeprecationWarning:sentinel.*",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: benchmarks and full-corpus runs",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/sentinel"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
precision = 1
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 90
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # The economics and generator modules carry long prose docstrings with
    # formulas and tables that read worse when hard-wrapped.
    "E501",
    # Broad excepts are deliberate at every degradation boundary; each one is
    # documented at the call site with why it must not propagate.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]
